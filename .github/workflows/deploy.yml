name: Deploy to Public Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          if [ -n "$ENV_PRODUCTION" ]; then
            printf '%s\n' "$ENV_PRODUCTION" > .env.production.local
          fi
          npm run build

      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          for key in SERVER_HOST SERVER_USER SERVER_SSH_KEY SERVER_DEPLOY_PATH; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub Secret: $key"
              exit 1
            fi
          done
          if [ "$SERVER_DEPLOY_PATH" = "/" ]; then
            echo "::error::SERVER_DEPLOY_PATH cannot be '/'"
            exit 1
          fi

      - name: Deploy dist/ via SSH + rsync
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          PORT="${SERVER_PORT:-22}"
          DEPLOY_PATH="${SERVER_DEPLOY_PATH%/}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          SSH_OPTS="-i ~/.ssh/id_deploy -p ${PORT} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"

          ssh $SSH_OPTS "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${DEPLOY_PATH}'"

          rsync -avz --delete \
            --chmod=Du=rwx,Dg=rx,Do=rx,Fu=rw,Fg=r,Fo=r \
            --exclude='.well-known/' \
            --exclude='.user.ini' \
            --exclude='.htaccess' \
            -e "ssh $SSH_OPTS" \
            dist/ "${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/"

          rm -f ~/.ssh/id_deploy
